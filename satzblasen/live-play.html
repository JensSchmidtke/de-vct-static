<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sentence Bubbles Live | Deutsch mit Jens</title>
    <link rel="stylesheet" href="../room-kit/games.css" />
    <script src="/stats.js"></script>
    <style>
      .lh h1 { font-family: "Fraunces", serif; margin-bottom: 0.5rem; }
      .lh-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 1rem 1rem; box-shadow: 0 6px 18px var(--shadow); max-width: 560px; margin: 0 auto; }
      .lh-card h2 { font-family: "Fraunces", serif; font-size: 1.15rem; margin-bottom: 0.6rem; }
      .join label { display: block; font-size: 0.9rem; font-weight: 500; margin: 0.8rem 0 0.25rem; }
      .join input { width: 100%; font: inherit; font-size: 1.2rem; padding: 0.55rem 0.7rem; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
      .btn-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.7rem; justify-content: center; }
      .btn-row .button { cursor: pointer; font-family: inherit; }
      .note { font-size: 0.85rem; color: var(--muted); margin-top: 0.6rem; }
      .err { color: #b0463c; font-weight: 500; margin-top: 0.6rem; }
      .bar { display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; margin-bottom: 0.5rem; }
      .bar strong { color: var(--accent-dark); }
      .timer { font-weight: 700; font-variant-numeric: tabular-nums; padding: 0 0.7rem; border: 3px solid var(--accent-dark); border-radius: 999px; }
      .timer.low { border-color: #b0463c; color: #b0463c; }
      svg#board { width: 100%; height: auto; display: block; touch-action: manipulation; user-select: none; margin: 0 auto; }
      .bubble { cursor: pointer; }
      .bubble rect { fill: #fffaf3; stroke: #d7c8b8; stroke-width: 3; }
      .bubble.sel rect { fill: #f6dfd0; stroke: #b66a3c; }
      .bubble.start rect { fill: #e6f1da; stroke: #6a9a4f; stroke-width: 4; }
      .bubble.tip rect { fill: #dcebf6; stroke: #3d7a99; stroke-width: 5; }
      .bubble.used { cursor: default; }
      .bubble.used rect { fill: #e6e1d8; stroke: #cfc7ba; }
      .bubble text { font-family: "Space Grotesk", sans-serif; font-weight: 500; fill: #1b1a16; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
      .bubble.used text { fill: #9b9486; }
      .bubble .fo { width: 100%; height: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 6px;
                    font-family: "Space Grotesk", sans-serif; font-weight: 500; line-height: 1.05; color: #1b1a16; hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word; pointer-events: none; }
      .bubble.used .fo { color: #9b9486; }
      .word { min-height: 2.2rem; font-size: 1.2rem; font-weight: 600; text-align: center; margin-top: 0.4rem; overflow-wrap: anywhere; }
      .msg { min-height: 1.4rem; text-align: center; font-size: 1rem; }
      .msg.ok { color: #3f7d3f; font-weight: 600; }
      .msg.no { color: #b0463c; }
      .score { font-size: 1.05rem; margin-top: 0.6rem; text-align: center; }
      .score strong { color: var(--accent-dark); }
      .found { list-style: none; margin-top: 0.4rem; font-size: 1rem; }
      .found li { padding: 0.15rem 0; }
      .result { text-align: center; font-size: 1.15rem; margin-top: 0.6rem; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body class="project-page">
    <header class="site-header">
      <div class="container">
        <a href="/">← Deutsch mit Jens</a>
        <span class="where">Games for the classroom</span>
      </div>
    </header>

    <main>
      <section class="section lh">
        <div class="container">
          <h1>Sentence Bubbles</h1>

          <div class="lh-card join" id="join">
            <h2>Join the game</h2>
            <label for="code">Room code</label>
            <input id="code" type="text" maxlength="5" autocapitalize="characters" autocomplete="off" />
            <label for="nick">Your nickname</label>
            <input id="nick" type="text" maxlength="20" autocomplete="off" />
            <p class="note">Use a nickname, not your real name. It is shown on the teacher’s screen.</p>
            <p class="err" id="err" hidden></p>
            <div class="btn-row"><button class="button" id="go" type="button">Join</button></div>
          </div>

          <div class="lh-card" id="game" hidden>
            <div class="bar"><span id="who"></span><span class="timer" id="timer" hidden></span></div>
            <p class="msg" id="wait"></p>
            <div id="play" hidden>
              <svg id="board" viewBox="0 0 600 600" role="group" aria-label="The grid"></svg>
              <div class="word" id="word" aria-live="polite"></div>
              <p class="msg" id="msg" aria-live="polite"></p>
              <div class="btn-row">
                <button class="button" id="check" type="button">Check sentence</button>
                <button class="button ghost" id="tip" type="button" hidden>Tip</button>
                <button class="button ghost" id="clear" type="button">Clear</button>
                <button class="button ghost" id="undo" type="button">Undo last sentence</button>
              </div>
              <p class="note" style="text-align:center">Connect neighbouring bubbles in sentence order, diagonals too. Tap the last bubble to take it back. Use every word.</p>
            </div>
            <p class="score" id="score"></p>
            <ul class="found" id="found"></ul>
            <p class="result" id="result"></p>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <span>© 2026 <a href="https://jensschmidtke.de">Jens Schmidtke</a></span>
      </div>
    </footer>

    <script src="../room-kit/room-kit.js"></script>
    <script src="../room-kit/room-kit-config.js"></script>
    <script src="../room-kit/room-kit-supabase.js"></script>
    <script src="hints.js"></script>
    <script src="live.js"></script>
    <script>
      (function () {
        var $ = function (id) { return document.getElementById(id); };
        var backend = RoomKit.makeBackend(), me = new RoomKit.Player(backend);
        var tips = new Hints.Tips(), pools = {}, snap = null, board = null, shownKey = null, path = [], clock = null, unsub = null, timeUp = false, myPoints = 0;
        var ERR = { "room-not-found": "That room does not exist (any more). Check the code.", "nickname-taken": "Someone in the room already uses that nickname. Pick another.", "bad-nickname": "Type a nickname of 1 to 20 characters.", "room-full": "That room is full." };

        var fromUrl = new URLSearchParams(location.search).get("room");
        if (fromUrl) $("code").value = fromUrl.toUpperCase();
        function showErr(m) { $("err").textContent = m; $("err").hidden = !m; }

        $("go").addEventListener("click", function () {
          showErr("");
          $("go").disabled = true;
          me.join($("code").value, $("nick").value, null).then(enter, function (e) { showErr(ERR[e.message] || "Could not join."); })
            .then(function () { $("go").disabled = false; });
        });
        $("nick").addEventListener("keydown", function (e) { if (e.key === "Enter") $("go").click(); });

        function enter() {
          $("join").hidden = true; $("game").hidden = false;
          if (unsub) unsub();
          unsub = me.subscribe(onSnapshot);
        }
        function leave(message) {
          if (unsub) { unsub(); unsub = null; }
          if (clock) { clock.stop(); clock = null; }
          me.forget(); $("game").hidden = true; $("join").hidden = false; showErr(message || "");
        }

        function layoutOf(s) {
          var d = s.room.data, idx = d.grids && d.grids[s.room.round], pool = pools[d.file];
          return pool && idx != null ? pool.layouts[idx] : null;
        }

        function onSnapshot(s) {
          snap = s;
          if (!s) { leave("The room was closed."); return; }
          if (!s.players.some(function (p) { return p.id === me.player.id; })) { leave("The teacher removed you from the room. Pick another nickname to join again."); return; }
          var d = s.room.data;
          if (pools[d.file] === undefined) {
            pools[d.file] = false;
            SentenceLive.loadPool(d.file).then(function (p) { pools[d.file] = p; if (snap) onSnapshot(snap); });
            return;
          }
          if (!pools[d.file]) return;
          draw(s);
        }

        function mine(s, layout) {
          var pool = pools[s.room.data.file], d = s.room.data;
          var ev = SentenceLive.evaluate(s, s.room.round, layout, pool.cols, d.startedAt + d.duration * 1000);
          var row = ev.rows.filter(function (r) { return r.player.id === me.player.id; })[0];
          return { row: row, rank: ev.rows.indexOf(row) + 1, of: ev.rows.length, total: layout.cells.length };
        }

        function draw(s) {
          var room = s.room, running = room.status === "running", layout = room.round ? layoutOf(s) : null, pool = pools[room.data.file];
          $("who").innerHTML = "<strong></strong>"; $("who").firstChild.textContent = me.player.nickname;
          $("wait").textContent = room.status === "lobby" ? "Waiting for the teacher to start the round." : "";
          $("result").textContent = "";

          if (running && layout) {
            var key = room.round + ":" + layout.cells.join("|");
            if (key !== shownKey) {
              shownKey = key; path = []; tips = new Hints.Tips(layout.valid); timeUp = false; $("word").textContent = ""; $("msg").textContent = ""; myPoints = 0;
              board = new SentenceLive.Board($("board"), layout, pool.cols, { onTap: tap });
            }
            if (!clock || clock.round !== room.round) {
              if (clock) clock.stop();
              clock = new RoomKit.Clock(room.data.startedAt, room.data.duration * 1000, function (left) {
                var t = $("timer"); t.hidden = false; var sec = Math.ceil(left / 1000); t.textContent = Math.floor(sec / 60) + ":" + ("0" + (sec % 60)).slice(-2); t.classList.toggle("low", left <= 10000);
              }, function () { timeUp = true; if (snap) draw(snap); });
              clock.round = room.round;
            }
          } else { if (clock) { clock.stop(); clock = null; } $("timer").hidden = true; if (!running) shownKey = null; }

          var m = layout ? mine(s, layout) : null;
          $("play").hidden = !(running && layout && !timeUp && !(m && m.row.solved));
          if (running && layout && timeUp) $("wait").textContent = "Time is up!";
          if (running && layout && m && m.row.solved) $("wait").textContent = "You used every word. Well done!";
          if (room.status === "ended" && m) $("wait").textContent = "Round " + room.round + " is over.";

          if (m) {
            myPoints = m.row.points;
            $("score").innerHTML = "<strong>" + m.row.points + " of " + m.total + "</strong> " + (s.room.data.hints ? "points" : "words connected") + " · wrong attempts: " + m.row.wrong;
            var f = $("found"); f.innerHTML = "";
            m.row.accepted.forEach(function (p) { var li = document.createElement("li"); li.textContent = SentenceLive.cap(SentenceLive.textOf(layout, p)); f.appendChild(li); });
            if (running && board && !$("play").hidden) {
              var used = m.row.used;
              path = path.filter(function (c) { return !used[c]; });
              board.render(used, path, m.row.accepted, tips.marks(used, hintsOn())); showWord();
            }
            if (room.status === "ended") $("result").textContent = "You finished " + m.rank + " of " + m.of + " in this round.";
            $("undo").disabled = !m.row.accepted.length;
            $("tip").hidden = !hintsOn(); $("tip").disabled = !path.length;
          } else { $("score").textContent = ""; $("found").innerHTML = ""; }
        }

        /* ---------- building a sentence ---------- */

        function wordsOf(p) { return snap && board ? p.map(function (i) { return board.layout.cells[i]; }).join(" ") : ""; }
        function hintsOn() { return !!(snap && snap.room.data.hints); }
        function showWord() { $("word").textContent = wordsOf(path); }
        function usedNow() { var l = board && board.layout; var m = snap && l ? mine(snap, l) : null; return m ? m.row.used : {}; }

        function tap(i) {
          if (timeUp || !board) return;
          var used = usedNow(); if (used[i]) return;
          var last = path[path.length - 1], at = path.indexOf(i);
          $("msg").textContent = ""; $("msg").className = "msg";
          tips.hide();
          if (i === last) path = path.slice(0, -1);
          else if (at >= 0) path = path.slice(0, at + 1);
          else if (path.length && SentenceLive.adjacent(last, i, board.cols)) path = path.concat(i);
          else { path = [i]; tips.reset(); }
          $("tip").disabled = !path.length;
          board.render(used, path, snap ? mine(snap, board.layout).row.accepted : [], tips.marks(used, hintsOn())); showWord();
        }

        $("clear").addEventListener("click", function () { path = []; tips.reset(); if (snap) draw(snap); $("msg").textContent = ""; });
        $("tip").addEventListener("click", function () {
          if (!snap || timeUp || !board || !path.length || !hintsOn()) return;
          var used = usedNow(), next = tips.ask(path, used);
          $("msg").className = "msg";
          $("msg").textContent = next.length ? "Tip: the next word is one of the blue bubbles (no point for it)." : "No word from the list fits here.";
          board.render(used, path, mine(snap, board.layout).row.accepted, tips.marks(used, true));
        });

        $("check").addEventListener("click", function () {
          if (!snap || timeUp || path.length < 2) return;
          var msg = $("msg"), before = myPoints; msg.className = "msg";
          var tipCount = hintsOn() ? tips.cost(path.length) : 0;
          try { me.submit({ path: path.slice(), tips: tipCount }); }
          catch (e) { msg.textContent = "The round is not running."; msg.classList.add("no"); return; }
          path = []; tips.reset();
          if (myPoints > before) { msg.textContent = "Connected: +" + (myPoints - before); msg.classList.add("ok"); }
          else { msg.textContent = "Not a sentence the grid accepts."; msg.classList.add("no"); }
          draw(snap);
        });

        $("undo").addEventListener("click", function () {
          if (!snap || timeUp || !board) return;
          var acc = mine(snap, board.layout).row.accepted;
          if (!acc.length) return;
          try { me.submit({ undo: acc[acc.length - 1] }); } catch (e) { return; }
          path = []; tips.reset(); $("msg").textContent = ""; if (snap) draw(snap);
        });

        if (fromUrl) me.resume(fromUrl).then(function (ok) { if (ok) enter(); });
      })();
    </script>
  </body>
</html>
