<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Article Hunt | Deutsch mit Jens</title>
    <link rel="stylesheet" href="../room-kit/games.css" />
    <script src="/stats.js"></script>
    <script src="articles.js"></script>
    <style>
      .ah h1 { font-family: "Fraunces", serif; margin-bottom: 0.5rem; }
      .ah-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 1.1rem 1.2rem; box-shadow: 0 6px 18px var(--shadow); max-width: 460px; }
      .ah-card label { display: block; font-size: 0.9rem; font-weight: 500; margin: 0.2rem 0 0.25rem; }
      .ah-card select { width: 100%; font: inherit; font-size: 1.1rem; padding: 0.5rem 0.7rem; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
      .ah-card .button { cursor: pointer; font-family: inherit; font-size: 1rem; margin-top: 1rem; }
      [hidden] { display: none !important; }

      .play { display: flex; flex-direction: column; height: calc(100vh - 4.2rem); min-height: 480px; padding: 0.6rem 0; }
      .bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem; }
      .score, .clock { font-size: clamp(1.1rem, 2.6vh, 1.6rem); font-weight: 600; font-variant-numeric: tabular-nums; }
      .clock { text-align: right; }
      .score small, .clock small { display: block; font-size: 0.75rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
      .article { font-family: "Fraunces", serif; font-weight: 700; font-size: clamp(2.6rem, 9vh, 5rem); line-height: 1; padding: 0.1em 0.6em 0.18em; border-radius: 18px; color: #fff; text-align: center; min-width: 3.2em; }
      .article.m { background: #3d7a99; } .article.f { background: #c0506a; } .article.n { background: #5a8f5a; }
      .meter { height: 8px; background: var(--line); border-radius: 4px; margin: 0.6rem 0 0.7rem; overflow: hidden; }
      .meter span { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left; }
      .grid { position: relative; flex: 1; min-height: 0; display: grid; gap: 0.6rem; }
      .cell { font: inherit; font-weight: 500; font-size: clamp(1.1rem, 3.4vh, 2rem); color: var(--ink); background: #fffaf3; border: 3px solid var(--line); border-radius: 999px; cursor: pointer; padding: 0 0.4rem; overflow-wrap: anywhere; hyphens: auto; line-height: 1.05; }
      .cell:hover { border-color: var(--accent); }
      .cell.pop { animation: pop 0.25s ease; }
      @keyframes pop { from { transform: scale(0.7); opacity: 0.3; } to { transform: scale(1); opacity: 1; } }
      .grid.locked .cell { opacity: 0.35; cursor: not-allowed; }
      .grid.locked .cell:hover { border-color: var(--line); }
      .lock { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #b0463c; color: #fff; font-size: clamp(1.2rem, 4vh, 2.2rem); font-weight: 700; padding: 0.4em 1em; border-radius: 14px; pointer-events: none; }
      .over { position: fixed; inset: 0; background: rgba(27, 26, 22, 0.5); display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 20; }
      .over .ah-card { text-align: center; }
      .over .big { font-family: "Fraunces", serif; font-size: 3.4rem; font-weight: 700; line-height: 1.1; }
      body.playing .ah h1, body.playing .site-footer { display: none; }
      body.playing .ah .container { width: min(1400px, 96vw); }
      body.playing .section.ah { padding: 0; }
    </style>
  </head>
  <body class="project-page">
    <header class="site-header">
      <div class="container">
        <a href="/">← Deutsch mit Jens</a>
        <span class="where">Games for the classroom</span>
      </div>
    </header>

    <main class="section ah">
      <div class="container">
        <h1>Article Hunt</h1>

        <div id="setup" class="ah-card">
          <p style="margin-bottom:0.9rem">You get an article: <strong>der</strong>, <strong>die</strong> or <strong>das</strong>. Click every word with that article. A wrong click freezes the grid for a few seconds.</p>
          <label for="level">Words</label>
          <select id="level"></select>
          <label for="duration" style="margin-top:0.8rem">Round length</label>
          <select id="duration">
            <option value="60">60 seconds</option>
            <option value="90">90 seconds</option>
            <option value="180">180 seconds</option>
          </select>
          <button id="start" class="button" type="button">Start</button>
        </div>

        <div id="play" class="play" hidden>
          <div class="bar">
            <div class="score"><small>Points</small><span id="score">0</span></div>
            <div id="article" class="article">der</div>
            <div class="clock"><small>Time</small><span id="clock">1:00</span></div>
          </div>
          <div class="meter"><span id="meter"></span></div>
          <div id="grid" class="grid"></div>
        </div>
      </div>
    </main>

    <div id="over" class="over" hidden>
      <div class="ah-card">
        <h2 style="font-family:'Fraunces',serif">Time is up</h2>
        <div class="big" id="final">0</div>
        <p id="detail" style="color:var(--muted);margin-top:0.3rem"></p>
        <button id="again" class="button" type="button">Play again</button>
      </div>
    </div>

    <footer class="site-footer">
      <div class="container">
        <span>© 2026 <a href="https://jensschmidtke.de">Jens Schmidtke</a></span>
        <span>Words: Netzwerk neu, chapters 1–6</span>
      </div>
    </footer>

    <script>
      (function () {
        // The timing is set here; change the numbers to try other values.
        var CFG = { ROUND: 60, ARTICLE: 15, PENALTY: 3, COLS: 5, ROWS: 4, MIN_MATCH: 4, RESHUFFLE: 3 };
        var ART = { m: 'der', f: 'die', n: 'das' };
        var $ = function (id) { return document.getElementById(id); };
        var bank = [], level = 6, cells = [], gender = 'm', score = 0, wrong = 0;
        var startAt = 0, articleAt = 0, lockUntil = 0, timer = null, running = false;

        fetch('nouns.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (d) {
          bank = d.words;
          for (var c = 1; c <= 6; c++) {
            var n = bank.filter(function (w) { return w[2] <= c; }).length, o = document.createElement('option');
            o.value = c; o.textContent = (c === 1 ? 'Netzwerk neu, chapter 1' : 'Netzwerk neu, up to chapter ' + c) + ' (' + n + ' nouns)';
            $('level').appendChild(o);
          }
          $('level').value = 1;
        });

        function pool() { return bank.filter(function (w) { return w[2] <= level; }); }
        function onGrid() { var s = {}; cells.forEach(function (w) { if (w) s[w[0]] = true; }); return s; }
        function draw(wantGender, notGender) {      // a noun that is not on the grid yet; notGender: not of the gender just replaced
          var on = onGrid(), p = pool().filter(function (w) { return !on[w[0]] && (!wantGender || w[1] === wantGender) && w[1] !== notGender; });
          return p[Math.floor(Math.random() * p.length)];
        }
        function matching() { return cells.filter(function (w) { return w && w[1] === gender; }).length; }

        function render(popIndex) {
          var g = $('grid'); g.innerHTML = '';
          g.style.gridTemplateColumns = 'repeat(' + CFG.COLS + ', 1fr)'; g.style.gridTemplateRows = 'repeat(' + CFG.ROWS + ', 1fr)';
          cells.forEach(function (w, i) {
            var b = document.createElement('button'); b.type = 'button'; b.className = 'cell' + (i === popIndex ? ' pop' : '');
            b.lang = 'de'; b.textContent = w[0]; b.addEventListener('click', function () { tap(i); });
            g.appendChild(b);
          });
          var lock = document.createElement('div'); lock.className = 'lock'; lock.id = 'lock'; lock.hidden = true; g.appendChild(lock);
        }

        function setArticle(g) {
          gender = g; articleAt = Date.now();
          var a = $('article'); a.textContent = ART[g]; a.className = 'article ' + g;
          ensure(null);
          render();
        }
        function reshuffle(skip) {                   // after a hit, a few other words change quietly too, so a change tells nothing
          var idx = [];
          cells.forEach(function (w, i) { if (i !== skip) idx.push(i); });
          for (var k = 0; k < CFG.RESHUFFLE; k++) {
            var j = idx.splice(Math.floor(Math.random() * idx.length), 1)[0];
            cells[j] = draw(null, cells[j][1]);
          }
        }
        function ensure(skip) {                      // make sure there is something to find: quietly turn other words into matching ones
          while (matching() < CFG.MIN_MATCH) {
            var idx = []; cells.forEach(function (w, i) { if (w[1] !== gender && i !== skip) idx.push(i); });
            cells[idx[Math.floor(Math.random() * idx.length)]] = draw(gender);
          }
        }
        function nextArticle() {
          var o = ['m', 'f', 'n'].filter(function (g) { return g !== gender; });
          setArticle(o[Math.floor(Math.random() * o.length)]);
        }

        function tap(i) {
          if (!running || Date.now() < lockUntil) return;
          if (cells[i][1] === gender) {
            score++; $('score').textContent = score; ArticleHunt.pop();
            var old = cells[i][1];
            cells[i] = null;
            cells[i] = draw(null, old);             // the new word never has the gender of the one it replaces
            reshuffle(i);
            ensure(i);                              // and if matching words are running out, another word changes without anyone noticing
            render(i);
          } else {
            wrong++; lockUntil = Date.now() + CFG.PENALTY * 1000;
            $('grid').classList.add('locked'); $('lock').hidden = false;
          }
        }

        function tick() {
          var now = Date.now(), left = CFG.ROUND * 1000 - (now - startAt);
          if (left <= 0) return finish();
          var s = Math.ceil(left / 1000); $('clock').textContent = Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
          if (now - articleAt >= CFG.ARTICLE * 1000) nextArticle();
          $('meter').style.transform = 'scaleX(' + Math.max(0, 1 - (now - articleAt) / (CFG.ARTICLE * 1000)) + ')';
          var g = $('grid');
          if (now < lockUntil) { var l = $('lock'); if (l) { l.hidden = false; l.textContent = 'Wrong. Wait ' + Math.ceil((lockUntil - now) / 1000) + ' s'; } }
          else if (g.classList.contains('locked')) { g.classList.remove('locked'); var l2 = $('lock'); if (l2) l2.hidden = true; }
        }

        function start() {
          level = +$('level').value; CFG.ROUND = +$('duration').value; score = 0; wrong = 0; lockUntil = 0;
          cells = []; for (var i = 0; i < CFG.COLS * CFG.ROWS; i++) cells.push(draw());
          $('score').textContent = '0'; $('over').hidden = true; $('setup').hidden = true; $('play').hidden = false;
          document.body.classList.add('playing'); window.scrollTo(0, 0);
          running = true; startAt = Date.now();
          var g = ['m', 'f', 'n'][Math.floor(Math.random() * 3)];
          setArticle(g); articleAt = Date.now();
          if (timer) clearInterval(timer);
          timer = setInterval(tick, 100); tick();
        }
        function finish() {
          running = false; clearInterval(timer); timer = null;
          $('final').textContent = score + (score === 1 ? ' point' : ' points');
          $('detail').textContent = wrong + (wrong === 1 ? ' wrong click' : ' wrong clicks');
          $('over').hidden = false;
        }

        $('start').addEventListener('click', start);
        $('again').addEventListener('click', function () {
          $('over').hidden = true; $('play').hidden = true; $('setup').hidden = false; document.body.classList.remove('playing');
        });
      })();
    </script>
  </body>
</html>
