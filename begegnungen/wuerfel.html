<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Würfel</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#b66a3c">
<style>
:root{--bg:#f7f5f2;--fg:#1a1a1a;--muted:#8a857e;--line:#e0dbd4;--card:#fff;--acc:#b66a3c;--pip:#1a1a1a}
@media(prefers-color-scheme:dark){:root{--bg:#161618;--fg:#ececea;--muted:#8f8a83;--line:#33333a;--card:#26262b;--pip:#f2f0ec}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
     background:var(--bg);color:var(--fg);display:flex;flex-direction:column;
     padding:max(10px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));
     touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);flex:0 0 auto}
.top a{color:var(--muted);text-decoration:none;padding:6px 2px}

.row{display:flex;gap:7px;justify-content:center;flex:0 0 auto;margin-top:9px}
.row button{font:inherit;font-weight:700;font-size:15px;flex:1 1 0;height:44px;border-radius:12px;
     cursor:pointer;border:2px solid var(--line);background:var(--card);color:var(--fg)}
.row.count button{max-width:88px}
.row.sides button{max-width:56px;font-size:14px}
.row button.on{border-color:var(--acc);background:var(--acc);color:#fff}
.caption{text-align:center;font-size:11px;color:var(--muted);flex:0 0 auto;margin-top:4px}

#stage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;cursor:pointer}
.dice{display:grid;gap:min(4vw,18px);width:100%;place-items:center}
.die{width:100%;aspect-ratio:1;background:var(--card);border:2px solid var(--line);border-radius:16%;
     box-shadow:0 3px 12px rgba(0,0,0,.10)}
.die.pips{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:12%;gap:5%}
.die.pips span{border-radius:50%;background:var(--pip);align-self:center;justify-self:center;width:100%;aspect-ratio:1}
.die.num{display:flex;align-items:center;justify-content:center;color:var(--pip);
     font-weight:800;font-size:clamp(34px,15vw,84px);line-height:1;font-variant-numeric:tabular-nums}
.die.rolling{animation:sh .42s cubic-bezier(.3,1.4,.5,1)}
@keyframes sh{0%{transform:rotate(0) scale(.86)}55%{transform:rotate(9deg) scale(1.04)}100%{transform:rotate(0) scale(1)}}
@media(prefers-reduced-motion:reduce){.die.rolling{animation:none}}

.sum{text-align:center;font-size:14px;color:var(--muted);min-height:20px;margin:8px 0 10px;flex:0 0 auto}
.sum b{color:var(--fg);font-size:20px}
.roll{flex:0 0 auto;font:inherit;font-size:1.15rem;font-weight:700;width:100%;padding:17px 0;
      border-radius:16px;border:none;background:var(--acc);color:#fff;cursor:pointer;line-height:1.2}
.roll .en{display:block;font-size:.7rem;font-weight:600;opacity:.85}
.roll:active{opacity:.85}
</style>
</head>
<body>
  <div class="top"><a href="tools.html">&lsaquo; Zurück</a><span>Würfel · Dice</span><span style="width:52px"></span></div>

  <div class="row count" id="count"></div>
  <div class="caption">Wie viele? · how many</div>
  <div class="row sides" id="sides"></div>
  <div class="caption">Wie viele Zahlen? · how many numbers</div>

  <div id="stage"><div class="dice" id="dice"></div></div>

  <div class="sum" id="sum"></div>
  <button class="roll" id="roll">Würfeln<span class="en">Roll</span></button>

<script>
// Classic pip layout only exists for 1-6; above that a die shows its number.
const PIPS  = {1:[5], 2:[1,9], 3:[1,5,9], 4:[1,3,7,9], 5:[1,3,5,7,9], 6:[1,3,4,6,7,9]};
const SIDES = [4, 6, 8, 10, 12, 20];
const $ = id => document.getElementById(id);
let n = 1, sides = 6;
try{
  n = Math.min(2, Math.max(1, parseInt(localStorage.wuerfelN) || 1));
  if (SIDES.includes(+localStorage.wuerfelS)) sides = +localStorage.wuerfelS;
}catch(e){}

[1,2].forEach(i=>{
  const b=document.createElement('button');
  b.textContent = i + (i===1 ? ' Würfel' : ' Würfel');
  b.onclick = () => { n=i; try{localStorage.wuerfelN=i}catch(e){}; paint(); roll(); };
  $('count').appendChild(b);
});
SIDES.forEach(s=>{
  const b=document.createElement('button');
  b.textContent = '1–' + s;
  b.onclick = () => { sides=s; try{localStorage.wuerfelS=s}catch(e){}; paint(); roll(); };
  $('sides').appendChild(b);
});
function paint(){
  [...$('count').children].forEach((b,i)=>b.classList.toggle('on', i+1===n));
  [...$('sides').children].forEach((b,i)=>b.classList.toggle('on', SIDES[i]===sides));
}
function die(v){
  const d=document.createElement('div');
  d.setAttribute('role','img'); d.setAttribute('aria-label', v);
  if (sides <= 6){
    d.className='die pips rolling';
    for(let p=1;p<=9;p++){
      const c=document.createElement('span');
      if(!PIPS[v].includes(p)) c.style.visibility='hidden';
      d.appendChild(c);
    }
  } else {
    d.className='die num rolling';
    d.textContent=v;
  }
  return d;
}
function roll(){
  const values=Array.from({length:n},()=>Math.floor(Math.random()*sides)+1);
  const grid=$('dice');
  grid.style.gridTemplateColumns='repeat('+n+',1fr)';
  grid.style.maxWidth=(n===1?200:400)+'px';
  grid.replaceChildren(...values.map(die));
  $('sum').innerHTML = n>1 ? 'Summe · total: <b>'+values.reduce((a,b)=>a+b,0)+'</b>' : '';
  if(navigator.vibrate){ try{ navigator.vibrate(18); }catch(e){} }
}
$('roll').onclick=roll;
$('stage').onclick=roll;
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.key==='Enter'){ e.preventDefault(); roll(); }
});
paint(); roll();
</script>
</body></html>
