<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Begegnungen A1+ · Bildvokabeltrainer</title>
<meta name="description" content="Lerne den Wortschatz aus Begegnungen A1+ mit Bildern und Ton – Übung und Test, kapitelweise."/>
<meta name="robots" content="noindex"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f5f2;color:#1a1a1a;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
  .card{background:#fff;border-radius:16px;padding:2.75rem 2.5rem;max-width:520px;width:100%;text-align:center;
    box-shadow:0 4px 24px rgba(0,0,0,.08)}
  .label{font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#b66a3c;margin-bottom:1rem}
  h1{font-size:1.9rem;font-weight:700;line-height:1.2;margin-bottom:.3rem}
  .en{color:#999;font-weight:400}
  h1 .en{display:block;font-size:1rem;margin-top:.15rem}
  p.desc{font-size:1rem;line-height:1.6;color:#555;margin-bottom:0}
  p.desc .en{display:block;font-size:.85rem;margin-top:.2rem}
  p.desc{margin-bottom:1.75rem}
  .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;margin-bottom:1.75rem}
  .mode-grid .mode-btn:last-child:nth-child(odd){grid-column:1/-1;flex-direction:row;gap:.7rem;justify-content:center}
  .mode-btn{display:flex;flex-direction:column;align-items:center;gap:.3rem;padding:1.1rem .5rem;
    border:2px solid #e0dbd4;border-radius:14px;background:#fff;cursor:pointer;transition:border-color .15s,background .15s}
  .mode-btn .ic{font-size:1.6rem}
  .mode-btn .lbl{font-weight:700;font-size:.98rem}
  .mode-btn .lbl .en{display:block;font-size:.72rem;font-weight:600;color:#b66a3c}
  .mode-btn .sub{font-size:.78rem;color:#888}
  .mode-btn .sub .en{display:block;font-size:.7rem;color:#aaa}
  .mode-btn:hover{border-color:#b66a3c}
  .mode-btn.active{border-color:#b66a3c;background:#fdf4ef}
  .chapters{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;margin-bottom:1.5rem}
  .ch-btn{padding:.55rem 1rem;border:2px solid #e0dbd4;border-radius:999px;background:#fff;font-size:.9rem;
    font-weight:600;cursor:pointer;color:#333;transition:border-color .15s,background .15s}
  .ch-btn:hover:not(:disabled){border-color:#b66a3c}
  .ch-btn.active{border-color:#b66a3c;background:#fdf4ef}
  .ch-btn:disabled{color:#ccc;cursor:not-allowed;border-color:#eee}
  .start-btn{display:inline-block;background:#b66a3c;color:#fff;font-size:1.05rem;font-weight:700;
    padding:.85rem 2.5rem;border-radius:999px;text-decoration:none;transition:background .15s;border:none;cursor:pointer;
    line-height:1.3}
  .start-btn .en{display:block;font-size:.72rem;font-weight:600;opacity:.85}
  .start-btn:hover{background:#9a5530}
  .start-btn:disabled{background:#ddd;cursor:not-allowed}
  footer{margin-top:2.5rem;font-size:.8rem;color:#aaa}
  .tools-link{position:fixed;top:12px;right:12px;display:flex;align-items:center;gap:.35rem;
    padding:.4rem .7rem;border:1px solid #e0dbd4;border-radius:999px;background:#fff;
    font-size:.72rem;font-weight:600;color:#8a857e;text-decoration:none}
  .tools-link:hover{border-color:#b66a3c;color:#b66a3c}
  footer a{color:#aaa}
</style>
</head>
<body>
<a class="tools-link" href="tools.html" title="Werkzeuge · Classroom tools">🎲 Werkzeuge</a>

<div class="card">
  <div class="label">Begegnungen A1+</div>
  <h1>Bildvokabeltrainer<span class="en">Picture vocabulary trainer</span></h1>
  <p class="desc">Wähle einen Modus und ein Kapitel.
    <span class="en">Choose a mode and a chapter.</span></p>

  <div class="mode-grid" id="mode-grid">
    <button class="mode-btn active" data-mode="practice">
      <span class="ic">📚</span><span class="lbl">Üben<span class="en">Practice</span></span><span class="sub">alle Sätze, in Etappen<span class="en">all sentences, in stages</span></span>
    </button>
    <button class="mode-btn" data-mode="test">
      <span class="ic">📝</span><span class="lbl">Testen<span class="en">Test</span></span><span class="sub">15 Sätze, mit Ergebnis<span class="en">15 sentences, with a result</span></span>
    </button>
    <button class="mode-btn" data-mode="satzbau">
      <span class="ic">🧩</span><span class="lbl">Sätze bauen<span class="en">Sentence building</span></span><span class="sub">Wörter ordnen, 10 pro Runde<span class="en">put words in order, 10 per round</span></span>
    </button>
  </div>

  <div class="chapters" id="chapters"></div>

  <button class="start-btn" id="start-btn" disabled>Kapitel wählen<span class="en">Choose a chapter</span></button>
</div>
<footer>Ein Projekt von <a href="https://deutschmitjens.de">Deutsch mit Jens</a></footer>

<script>
const TOTAL_CHAPTERS = 8;
let mode = 'practice', chapter = null, manifest = { lessons: {} };

fetch('data/manifest.json').then(r => r.json()).then(m => { manifest = m; renderChapters(); }).catch(() => renderChapters());

document.querySelectorAll('.mode-btn').forEach(b => b.onclick = () => {
  mode = b.dataset.mode;
  document.querySelectorAll('.mode-btn').forEach(x => x.classList.toggle('active', x === b));
  updateStart();
});

function renderChapters() {
  const wrap = document.getElementById('chapters');
  wrap.innerHTML = '';
  for (let i = 1; i <= TOTAL_CHAPTERS; i++) {
    const has = !!manifest.lessons[String(i)];
    const b = document.createElement('button');
    b.className = 'ch-btn'; b.textContent = 'Kapitel ' + i;
    b.disabled = !has;
    if (has) b.onclick = () => { chapter = i; document.querySelectorAll('.ch-btn').forEach(x => x.classList.toggle('active', x === b)); updateStart(); };
    wrap.appendChild(b);
  }
}

function updateStart() {
  const btn = document.getElementById('start-btn');
  if (chapter) {
    btn.disabled = false;
    btn.innerHTML = mode === 'practice'
      ? 'Üben starten<span class="en">Start practice</span>'
      : mode === 'test'
      ? 'Test starten<span class="en">Start test</span>'
      : 'Sätze bauen<span class="en">Start sentence building</span>';
  }
}

document.getElementById('start-btn').onclick = () => {
  if (!chapter) return;
  location.href = mode === 'satzbau'
    ? `satzbau.html?ch=${chapter}`
    : `play.html?mode=${mode}&ch=${chapter}`;
};
</script>
</body>
</html>
