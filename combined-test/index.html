<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sprachstudie</title>
  <meta name="robots" content="noindex, nofollow"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f5f2;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 3rem 2.5rem;
      max-width: 560px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    .label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #b66a3c;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 1.25rem;
      color: #1a1a1a;
    }

    p {
      font-size: 1rem;
      line-height: 1.65;
      color: #555;
      margin-bottom: 0.75rem;
    }

    .start-btn {
      display: inline-block;
      background: #b66a3c;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 0.85rem 2.5rem;
      border-radius: 999px;
      text-decoration: none;
      margin-top: 1rem;
      transition: background 0.15s;
    }

    .start-btn:hover { background: #9a5530; }

    footer {
      margin-top: 2.5rem;
      font-size: 0.8rem;
      color: #aaa;
    }

    footer a { color: #aaa; }
  </style>
</head>
<body>
  <div class="card">
    <div class="label">Sprachstudie</div>
    <h1>Zwei kurze Tests zu deinem Deutsch</h1>
    <p>Du machst zwei kurze Wortschatztests hintereinander. Am Ende bekommst du eine Einschätzung deines Sprachniveaus.</p>
    <p>Vorher ein paar kurze Angaben zu deiner Person.</p>

    <a class="start-btn" href="/projects/combined-test/?lang=de">Test starten</a>
  </div>

  <footer>Ein Forschungsprojekt von <a href="https://jensschmidtke.de">Jens Schmidtke</a></footer>
</body>
</html>
